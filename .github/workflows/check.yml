# Runs on every push and Pull Request, so a broken ESLint template,
# unformatted file or broken docs link can't reach main unnoticed.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint templates pass their own rules
        run: pnpm check:eslint-templates

      - name: Formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Site builds with no broken links
        run: pnpm build
